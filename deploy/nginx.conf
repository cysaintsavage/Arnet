# /etc/nginx/sites-available/arnet  (replace example.com with the domain you own)
# Run certbot afterwards; it adds the HTTPS server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 6m;   # a little above MAX_UPLOAD_BYTES

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Needed so streamed AI replies appear word by word.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
